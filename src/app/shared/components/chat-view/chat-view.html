<div class="container">
    <header class="chat-header" role="banner" aria-label="Conversation header">
        <div class="header-left">
            <img class="avatar" [src]="info1().avatarUrl" alt="avatar" />
            <div class="person">
                <div class="name">{{ info1().name }}</div>
            </div>
        </div>

        <div class="header-right">
            <button class="icon-btn" aria-label="notifications"><img src="assets/icons/header/notifications.svg" alt=""></button>
            <button class="icon-btn" aria-label="settings"><img src="assets/icons/header/settings.svg" alt=""></button>
        </div>
    </header>

    <section class="chat-section">
        <!-- messages list (scrollable area) -->
        <div
        class="messages-list"
        #scrollContainer
        role="log"
        aria-live="polite"
        >
            <!-- center timestamp example -->
            <div class="center-time">10:35PM</div>

            <!-- message bubbles *ngFor="let m of messages; trackBy: trackByMsg"-->
            <ng-container>
                <div class="message-row" [class.me]="info().from === 'me'">
                    <img *ngIf="info().from === 'them'" class="msg-avatar" [src]="info().avatar" alt="" />
                    <div class="bubble-wrapper">
                        <div class="bubble">{{ info().text }}</div>
                        <div class="bubble-time">{{ info().time }}</div>
                    </div>
                    <img *ngIf="info().from === 'me'" class="msg-avatar" [src]="info().avatar" alt="" />
                </div>
            </ng-container>

            <!-- optional loader when fetching older messages 
            <div *ngIf="loadingOlder" class="loading-old">Loading…</div>-->
        </div>

        <!-- input area -->
        <div class="messages-input" role="form" aria-label="Send message">
            <button class="flat-btn" aria-label="attach image">
                <img src="assets/icons/flurr-dialog/image.png" alt="attach image" />
            </button>

            <button class="flat-btn" aria-label="attach file">
                <img src="assets/icons/flurr-dialog/video.png" alt="attach file" />
            </button>

            <div class="input-wrap">
                <input
                class="text-input"
                type="text"
                placeholder="Aa"
                aria-label="Type a message"
                />
            </div>

            <button class="flat-btn like-btn" aria-label="like">
                <img src="assets/icons/flurr-dialog/like.svg" alt="like" />
            </button>
        </div>
    </section>
</div>
