<div *ngFor="let comment of comments.slice().reverse()" class="comment">
  <!-- Comment Header -->
  <div class="comment-header">
    <img
      class="avatar"
      [src]="comment.author?.avatarUrl || '../../assets/avatar-img.avif'"
      [alt]="comment.author?.name || 'User'"
    />
    <span class="author-name">{{ comment.author?.name || 'Anonymous' }}</span>
  </div>

  <!-- Comment Text -->
  <label class="comment-text">{{ comment.text }}</label>

  <!-- Actions -->
  <div class="comment-actions">
    <button (click)="openCommentText(comment)" *ngIf="!comment.isOpen">Reply</button>
  </div>

  <!-- Reply Box -->
  <div *ngIf="comment.isOpen" class="reply-box">
    <button (click)="openCommentText(comment)">Cancel</button>

    <!-- per-comment reply text -->
    <textarea
      [(ngModel)]="comment.replyText"
      cols="60"
      rows="3"
      placeholder="Write your reply..."
    ></textarea>
    <br />
    <button (click)="addComment(comment)">OK</button>
  </div>

  <comment-tree
    [comments]="comment.anwsers"
    [currentUser]="currentUser"
  ></comment-tree>
</div>
