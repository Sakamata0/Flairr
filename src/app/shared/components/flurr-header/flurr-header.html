<header class="site-header" role="banner">
    <div class="left">
        <div class="logo">Flairr.</div>

        <div class="search-wrap" aria-hidden="false">
        <div class="search-container" role="search">
            <input
            id="search-input"
            type="text"
            placeholder="Search"
            aria-label="Search"
            (input)="onSearch($event)"
            />
            <i class="fa fa-magnifying-glass" aria-hidden="true"></i>
        </div>
        </div>
    </div>

    <nav class="center" role="navigation" aria-label="Main navigation">
        <button
        *ngFor="let item of items; let i = index"
        class="icon-item"
        [class.active]="activeKey === item.key"
        [attr.aria-pressed]="activeKey === item.key"
        (click)="toggle(item.key, $event)"
        (keydown)="onKeydown($event, i)"
        type="button"
        [attr.title]="item.label"
        >
            <span class="icon-bubble" aria-hidden="true">
                <img
                    [src]="'assets/icons/' + item.key + '.png'"
                    [attr.alt]="item.label"
                    width="30"
                    height="30"
                />
            </span>
            <span class="icon-label">{{ item.label }}</span>
        </button>
    </nav>

    <div class="right">
        <button class="small-btn" aria-label="Notifications"><i class="fa fa-bell"></i></button>
        <button class="small-btn" aria-label="Messages"><i class="fa fa-comment"></i></button>
        <div class="avatar" title="Profile">
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=200&auto=format&fit=crop&crop=faces" alt="User avatar" />
        </div>
    </div>
</header>
