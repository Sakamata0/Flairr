<div class="item">
    <div class="left-container">
        <div class="image-section">
            <img [src]="info()?.imageUrl" id="photo">
            <img [src]="info()?.iconUrl" id="icon">
        </div>
        <p><span id="title">{{ info()?.title }}</span><br *ngIf="!info()?.subtitleOnSameLevel"><span id="subtitle">{{ info()?.subtitle }}</span></p>
    </div>
    <button *ngIf="info()?.withButton" (click)="info()?.buttonAction()">
        {{ info()?.buttonText }}
    </button>
</div>
