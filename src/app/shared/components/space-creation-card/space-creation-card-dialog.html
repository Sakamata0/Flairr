<h2 class="header-dialog" mat-dialog-title>Create Your Space</h2>

<mat-dialog-content class="content-dialog">
  <!-- upper section -->
  <div class="flurr-upper">
    <div class="user-info">
      <img src="assets/avatars/avatar-example.jpg" alt="avatar-example" />
    </div>
    <div class="user-details">
      <h4>{{ username }}</h4>
      <!-- select -->
      <mat-form-field appearance="outline" class="flurr-select" id="privacy-select">
        <!--<mat-label>Choose privacy</mat-label>-->
        <mat-select placeholder="public" [(ngModel)]="selectedPrivacy" name="privacy">
          <mat-option value="public">public</mat-option>
          <mat-option value="private">private</mat-option>
          <mat-option value="friends">friends</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <!-- form section -->
  <form class="journey-inputs">
    <mat-form-field appearance="fill" class="journey-field">
      <mat-label>Space name</mat-label>
      <input
        matInput
        placeholder="What do you want to call your Space?"
        [(ngModel)]="spaceName"
        name="spaceName"
      />
    </mat-form-field>
    <mat-form-field appearance="fill" class="journey-field">
      <mat-label>Invite Friends (optional)</mat-label>
      <input
        matInput
        placeholder="eg: username1, username2, username3..."
        [(ngModel)]="spaceInvitation"
        name="spaceInvitation"
      />
    </mat-form-field>
  </form>

  <!-- bottom section -->
  <div class="flurr-bottom">
    <button class="icon">
      <img src="./assets/icons/flurr-dialog/image.png" alt="image-icon" />
      <span>Image</span>
    </button>
    <button class="icon">
      <img src="./assets/icons/flurr-dialog/video.png" alt="video-icon" />
      <span>Video</span>
    </button>
    <button class="icon">
      <img src="./assets/icons/flurr-dialog/tags.png" alt="tags-icon" />
      <span>Tags</span>
    </button>
    <button class="icon">
      <img src="./assets/icons/flurr-dialog/location.png" alt="location-icon" />
      <span>Location</span>
    </button>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="footer-dialog">
  <button class="btn" id="flurrBtn" matButton (click)="onNoClick()">Create Space!</button>
</mat-dialog-actions>
