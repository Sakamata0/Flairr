<header>
    <app-profile-header></app-profile-header>
</header>
<div class="layout">
    <nav>
        <app-journeys-selector></app-journeys-selector>
    </nav>
    <main>
        <app-flurr-creation-card></app-flurr-creation-card>
        <div id="sort-selection">
            <hr>
            <span (click)="toggleSortingMethodMenu($event)">Sort by: {{sortType}}
                <img src="assets/icons/home/arrow-down.png">
            </span>
            <div class="sorting-posts-menu" *ngIf="sortingPostsMethodOpen" role="menu" (click)="$event.stopPropagation()">
                <button 
                    role="menuitem" 
                    (click)="toggleSortingMethodMenu($event); sortType = 'Top'">
                    Top
                </button>
                <button
                    role="menuitem"
                    (click)="toggleSortingMethodMenu($event); sortType = 'Recent'">
                    Recent
                </button>
            </div>
            </div>
            
            <app-post></app-post>
            <app-post></app-post>
            <app-post></app-post>
            <app-post></app-post>
            <app-post></app-post>
            <app-post></app-post>
    </main>
    <aside>
        <app-card-panel title="My Flairr Spaces" noItemsMessage="You still didn't join any Flairr space" [items]="this.FlairrSpaces"></app-card-panel>
    </aside>
</div>
