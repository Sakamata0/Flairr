
<div class="layout">
    <nav>
        <app-mini-profile-card></app-mini-profile-card>
        <app-card-panel title="Shorcuts" noItemsMessage="You have no shortcuts yet." [items]="this.shortcuts"></app-card-panel>
    </nav>
    <main>
        <app-flurr-creation-card></app-flurr-creation-card>
        <div id="sort-selection">
            <hr>
            <span (click)="toggleSortingMethodMenu($event)">Sort by: {{sortType}}
                <img src="assets/icons/home/arrow-down.png">
            </span>
            <div class="sorting-posts-menu" *ngIf="sortingPostsMethodOpen" role="menu" (click)="$event.stopPropagation()">
                <button 
                    role="menuitem" 
                    (click)="toggleSortingMethodMenu($event); sortType = 'Top'">
                    Top
                </button>
                <button
                    role="menuitem"
                    (click)="toggleSortingMethodMenu($event); sortType = 'Recent'">
                    Recent
                </button>
            </div>
        </div>
        
        <app-post></app-post>
        <app-post></app-post>
        <app-post></app-post>
        <app-post></app-post>
        <app-post></app-post>
        <app-post></app-post>
    </main>
    <aside>
        <app-card-panel title="Notifications" noItemsMessage="You have no notification yet." [items]="this.notifications"></app-card-panel>
        <app-card-panel title="Friends Suggestions" noItemsMessage="You have no friends suggestions." [items]="this.friendsSuggestions"></app-card-panel>
        <div id="credits">
            <a>About us</a>
            <span>·</span>
            <a>Privacy Policy</a>
            <span>·</span>
            <a>Cookie Policy</a>
            <span>·</span>
            <p>© 2025 Flairr, Inc</p>
        </div>
    </aside>
</div>
