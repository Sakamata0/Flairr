<div class="layout">
    <nav>
        <app-mini-profile-card></app-mini-profile-card>
        <app-card-panel title="Shorcuts" noItemsMessage="You have no shortcuts yet." [items]="shortcuts"></app-card-panel>
    </nav>
    <main>
        <app-flurr-creation-card></app-flurr-creation-card>
        <div id="sort-selection">
            <hr>
            <span (click)="toggleSortingMethodMenu($event)">Sort by: {{sortType}}
                <img src="assets/icons/home/arrow-down.png">
            </span>
            <div class="sorting-posts-menu" *ngIf="sortingPostsMethodOpen" role="menu" (click)="$event.stopPropagation()">
                <button 
                    role="menuitem" 
                    (click)="toggleSortingMethodMenu($event); sortType = 'Top'; applySorting()">
                    Top
                </button>
                <button
                    role="menuitem"
                    (click)="toggleSortingMethodMenu($event); sortType = 'Recent'; applySorting()">
                    Recent
                </button>
            </div>
        </div>
        
        <ng-container *ngIf="!loading; else loadingTpl">
            <!-- Listen to postChanged event to refresh feed when user unfollows someone -->
            <app-post 
                *ngFor="let p of posts" 
                [post]="p"
                (postChanged)="onPostChanged()">
            </app-post>
            <div *ngIf="posts.length === 0" class="no-posts">
                <p>No posts to show.</p>
                <p>Follow some users to see their posts in your feed!</p>
            </div>
        </ng-container>

        <ng-template #loadingTpl>
            <div class="loading">Loading feed…</div>
        </ng-template>
    </main>
    <aside>
        <app-card-panel title="Notifications" noItemsMessage="You have no notification yet." [items]="this.notifications" link="notifications"></app-card-panel>
        <app-card-panel title="Friends Suggestions" noItemsMessage="You have no friends suggestions." [items]="this.friendsSuggestions"></app-card-panel>
        <div id="credits">
            <a>About us</a>
            <span>·</span>
            <a>Privacy Policy</a>
            <span>·</span>
            <a>Cookie Policy</a>
            <span>·</span>
            <p>© 2025 Flairr, Inc</p>
        </div>
    </aside>
</div>

<div class="loading-screen" *ngIf="loading">
  <h2>Flairr.</h2>
</div>
