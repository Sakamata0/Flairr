<header>
  <app-profile-header [profile]="profile"></app-profile-header>
</header>

<div class="layout">
  <nav>
    <app-journeys-selector (journeySelected)="onJourneySelected($event)"></app-journeys-selector>
  </nav>

  <main>

    <!-- Only show when viewing your own profile -->
    <app-flurr-creation-card *ngIf="isOwnProfile"></app-flurr-creation-card>

    <div id="sort-selection">
      <hr>
      <span (click)="toggleSortingMethodMenu($event)">Sort by: {{sortType}}
        <img src="assets/icons/home/arrow-down.png" />
      </span>

      <div class="sorting-posts-menu" *ngIf="sortingPostsMethodOpen">
        <button (click)="sortType='Top'; applySorting(); toggleSortingMethodMenu($event)">Top</button>
        <button (click)="sortType='Recent'; applySorting(); toggleSortingMethodMenu($event)">Recent</button>
      </div>
    </div>

    <ng-container *ngIf="!loading; else loadingTpl">
      <ng-container *ngIf="posts.length > 0; else noPosts">
        <app-post *ngFor="let p of posts"
          [show]=1
          [post]="$any({
            id: p.flurr_id,
            content: p.content,
            type: p.type,
            created_at: p.created_at ?? p.date_publish,
            media: p.media || [],
            reactions: { like: p.likes_count || 0 },
            commentsCount: p.comments_count || 0,
            userHasLiked: p.userHasLiked || false,
            comments: p.comments || [],
            author: {
              id: profile?.user_id,
              name: profile?.full_name || profile?.username || 'Unknown',
              avatarUrl: profile?.avatar_img || './assets/images/hama.png',
              isFollowed: false
            },
            poster: {
              user_id: profile?.user_id,
              full_name: profile?.full_name,
              avatar_img: profile?.avatar_img
            }
          })">
        </app-post>
      </ng-container>

      <ng-template #noPosts>
        <p class="no-posts">
          {{ isOwnProfile ? 'You haven\'t posted anything yet.' : 'No posts yet.' }}
        </p>
      </ng-template>
    </ng-container>

    <ng-template #loadingTpl>
      <p class="loading">Loading profile…</p>
    </ng-template>

  </main>

  <aside>
    <app-card-panel
      title="My Flairr Spaces"
      [noItemsMessage]="isOwnProfile ? 'You still didn\'t join any Flairr space' : 'No spaces joined yet'"
      [items]="FlairrSpaces">
    </app-card-panel>
  </aside>
</div>

<div class="loading-screen" *ngIf="loading">
  <h2>F</h2>
</div>
