<header>
  <app-profile-header [profile]="space"></app-profile-header>
</header>

<div class="layout">

  <nav>
    <div class="about-card" *ngIf="space">
      <h3 class="legend">About</h3>
      <p class="paragraph">{{ space.bio || 'No description yet.' }}</p>
    </div>
  </nav>

  <main>

    <!-- Create flurr inside space -->
    <app-space-flurr-creation-card
      *ngIf="space"
      [currentSpaceID]="space.space_id">
    </app-space-flurr-creation-card>

    <!-- SORT -->
    <div id="sort-selection">
      <hr>
      <span (click)="toggleSortingMethodMenu($event)">
        Sort by: {{ sortType }}
        <img src="assets/icons/home/arrow-down.png" />
      </span>

      <div class="sorting-posts-menu" *ngIf="sortingPostsMethodOpen">
        <button (click)="sortType='Top'; applySorting(); toggleSortingMethodMenu($event)">
          Top
        </button>
        <button (click)="sortType='Recent'; applySorting(); toggleSortingMethodMenu($event)">
          Recent
        </button>
      </div>
    </div>

    <!-- POSTS -->
    <ng-container *ngIf="!loading; else loadingTpl">
      <ng-container *ngIf="posts.length > 0; else noPosts">

        <app-post
          *ngFor="let p of posts"
          [post]="$any({
            id: p.flurr_id,
            content: p.content,
            created_at: p.created_at,
            poster: p.poster
          })">
        </app-post>

      </ng-container>

      <ng-template #noPosts>
        <p class="no-posts">No posts in this space yet.</p>
      </ng-template>
    </ng-container>

    <ng-template #loadingTpl>
      <p class="loading">Loading space…</p>
    </ng-template>

  </main>

  <aside>
    <app-card-panel
      title="Invite Friends"
      noItemsMessage="No invitations available"
      [items]="invitations">
    </app-card-panel>
  </aside>

</div>
