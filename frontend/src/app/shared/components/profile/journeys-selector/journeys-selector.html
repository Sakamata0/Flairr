<div class="container">
    <header>
    <h3>Journeys</h3>
    <select
        name="Year"
        id="year-selector"
        (change)="selectYear($any($event.target).value)"
    >
        <option value="">Year</option>
        <option *ngFor="let year of years()" [value]="year">
            {{ year }}
        </option>
    </select>

    </header>
    <main>
        <h4 *ngIf="journeys().length == 0" id="no-items-message">
            "You don't have journeys yet"
        </h4>
        <div id="journeys-container">
            <ul *ngIf="!expandedList">
                <li 
                    *ngFor="let journey of lastJourneys(); let i = index"
                    (click)="selectJourney(journey.id)"
                    [class.selected]="selectedJourney === journey.id">{{ journey.name }}
                </li>
            </ul>
            <ul *ngIf="expandedList">
                <li 
                    *ngFor="let journey of journeys(); let i = index"
                    (click)="selectJourney(journey.id)"
                    [class.selected]="selectedJourney === journey.id">{{ journey.name }}
                </li>
            </ul>
        </div>
    </main>
    <footer>
        <a  id="see-more"
            *ngIf="journeys().length > 5"
            (click)="expandedList = !expandedList">{{expandedList? 'Show less': 'Show more'}}
        </a>
    </footer>
</div>
