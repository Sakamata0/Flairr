<link rel="stylesheet" href="https://use.typekit.net/tjl8ldc.css" />

<div class="profile-card" (click)="goToProfile()">
  <div class="banner">
    <img [src]="info().banner" (error)="onBannerError($event)" class="banner-img" />
    <img [src]="info().avatar" (error)="onImageError($event)" class="profile-img" />

    <span *ngIf="info().mutuals === 1" class="mutuals"> {{ info().mutuals }} mutual friend </span>
    <span *ngIf="info().mutuals > 1" class="mutuals"> {{ info().mutuals }} mutual friends </span>
  </div>

  <div class="content">
    <h2 class="name">{{ info().name }}</h2>

    <div class="buttons">
      <button
        class="Accept"
        *ngIf="variab() === 0"
        (click)="$event.stopPropagation(); accept.emit()"
      >
        Accept
      </button>

      <button
        class="Accept"
        *ngIf="variab() === 1"
        (click)="$event.stopPropagation(); follow.emit()"
      >
        Follow
      </button>

      <button
        class="Accept"
        *ngIf="variab() === 2"
        (click)="$event.stopPropagation(); follow.emit()"
      >
        Follow
      </button>

      <button
        class="Accept"
        *ngIf="variab() === 3"
        (click)="$event.stopPropagation(); follow.emit()"
      >
        Message
      </button>

      <button
        class="Delete"
        *ngIf="variab() !== 3"
        (click)="$event.stopPropagation(); remove.emit()"
      >
        Delete
      </button>

      <button
        class="Delete"
        *ngIf="variab() === 3"
        (click)="$event.stopPropagation(); remove.emit()"
      >
        Following
      </button>
    </div>
  </div>
</div>
