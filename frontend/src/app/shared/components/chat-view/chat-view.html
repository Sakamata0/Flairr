<div class="container">
  <header class="chat-header">
    <div class="header-left">
      <img
        class="avatar"
        [src]="displayThread?.avatar"
        alt="avatar"
      />
      <div class="person">
        <div class="name">{{ displayThread?.name || 'Conversation' }}</div>
      </div>
    </div>

    <div class="header-right">
      <button class="icon-btn">
        <img src="assets/icons/header/notifications.svg" />
      </button>
      <button class="icon-btn">
        <img src="assets/icons/header/settings.svg" />
      </button>
    </div>
  </header>

  <section class="chat-section">
    <div class="messages-list" #scrollContainer>
      <ng-container *ngIf="messages.length; else empty">
        <div
          *ngFor="let m of messages; trackBy: trackByMsg"
          class="message-row"
          [class.me]="m.from === 'me'"
        >
          <img *ngIf="m.from === 'them'" class="msg-avatar" [src]="m.avatar" />

          <div class="bubble-wrapper" [class.me]="m.from === 'me'">
            <div class="bubble">{{ m.content }}</div>
            <div class="bubble-time">
              {{ m.created_at | date : 'shortTime' }}
            </div>
          </div>

          <img *ngIf="m.from === 'me'" class="msg-avatar" [src]="m.avatar" />
        </div>
      </ng-container>

      <ng-template #empty>
        <div class="empty">No messages yet. Say hi 👋</div>
      </ng-template>
    </div>

    <div class="messages-input">
      <button class="flat-btn">
        <img src="assets/icons/flurr-dialog/image.png" />
      </button>

      <button class="flat-btn">
        <img src="assets/icons/flurr-dialog/video.png" />
      </button>

      <div class="input-wrap">
        <form (ngSubmit)="send()" style="display:flex; gap:8px">
          <input
            class="text-input"
            type="text"
            placeholder="Aa"
            [(ngModel)]="text"
            name="text"
          />

          <div class="send-slot">
            <button
              *ngIf="text.trim()"
              type="submit"
              class="flat-btn send-btn"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>

            <button *ngIf="!text.trim()" type="button" class="flat-btn like-btn" (click)="sendLike()">
              <img src="assets/icons/flurr-dialog/like.svg" />
            </button>
          </div>
        </form>
      </div>
    </div>
  </section>
</div>
