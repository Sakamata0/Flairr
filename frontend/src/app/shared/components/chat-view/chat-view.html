<div class="container">
  <header class="chat-header" role="banner" aria-label="Conversation header">
    <div class="header-left">
      <!-- Show loading skeleton or blank state while fetching user details -->
      <ng-container *ngIf="loadingThreadHeader; else showThread">
        <div class="avatar skeleton-avatar"></div>
        <div class="person">
          <div class="name skeleton-text"></div>
        </div>
      </ng-container>

      <ng-template #showThread>
        <img
          class="avatar"
          [src]="displayThread?.avatar || 'assets/images/profile-picture-test.jpg'"
          alt="avatar"
        />
        <div class="person">
          <div class="name">{{ displayThread?.name || 'Conversation' }}</div>
        </div>
      </ng-template>
    </div>

    <div class="header-right">
      <button class="icon-btn" aria-label="notifications">
        <img src="assets/icons/header/notifications.svg" alt="" />
      </button>
      <button class="icon-btn" aria-label="settings">
        <img src="assets/icons/header/settings.svg" alt="" />
      </button>
    </div>
  </header>
  <section class="chat-section">
    <!-- messages list (scrollable area) -->
    <div class="messages-list" #scrollContainer role="log" aria-live="polite">
      <!-- center timestamp example -->
      <div class="center-time">10:35PM</div>
      <!-- message bubbles -->
      <ng-container *ngIf="messages.length; else noMessages">
        <div
          *ngFor="let m of messages; trackBy: trackByMsg"
          class="message-row"
          [class.me]="m.from === 'me'"
        >
          <img *ngIf="m.from === 'them'" class="msg-avatar" [src]="m.avatar" alt="" />
          <div class="bubble-wrapper" [class.me]="m.from === 'me'">
            <div class="bubble">{{ m.content }}</div>
            <div class="bubble-time">{{ m.created_at | date : 'shortTime' }}</div>
          </div>
          <img *ngIf="m.from === 'me'" class="msg-avatar" [src]="m.avatar" alt="" />
        </div>
      </ng-container>
      <ng-template #noMessages>
        <div class="empty" style="text-align: center; padding: 18px; color: #6b7f68">
          No messages yet. Say hi 👋
        </div>
      </ng-template>
      <!-- optional loader when fetching older messages -->
      <div *ngIf="loadingOlder" class="loading-old">Loading…</div>
    </div>
    <!-- input area -->
    <div class="messages-input" role="form" aria-label="Send message">
      <button class="flat-btn" aria-label="attach image">
        <img src="assets/icons/flurr-dialog/image.png" alt="attach image" />
      </button>
      <button class="flat-btn" aria-label="attach file">
        <img src="assets/icons/flurr-dialog/video.png" alt="attach file" />
      </button>
      <div class="input-wrap">
        <form (ngSubmit)="send()" #f="ngForm" style="display: flex; gap: 8px; align-items: center">
          <input
            name="text"
            class="text-input"
            type="text"
            placeholder="Aa"
            aria-label="Type a message"
            [(ngModel)]="text"
            autocomplete="off"
          />
          <button type="submit" class="flat-btn like-btn" aria-label="send message">
            <img src="assets/icons/flurr-dialog/like.svg" alt="send" />
          </button>
        </form>
      </div>
    </div>
  </section>
</div>
