<!-- message-component.html - UPDATED VERSION -->
<div class="container">
  <div class="left">
    <div class="image">
      <img
        [src]="displayContact?.avatar || contact.avatar || 'assets/images/profile-picture-test.jpg'"
        id="photo"
        height="53"
        alt="{{ displayContact?.name || contact.name || 'avatar' }}"
      >
    </div>

    <div class="info">
      <h4 class="username">{{ displayContact?.name || contact.name || 'Unknown' }}</h4>

      <span class="span">
        <p class="text" [class.no-message]="!contact.lastMessage">
          {{ contact.lastMessage || 'No messages yet' }}
        </p>
        <p class="time" *ngIf="contact.lastAt">
          &ThickSpace;{{ contact.lastAt | date:'shortTime' }}
        </p>
      </span>
    </div>
  </div>

  <div class="right" *ngIf="contact.unreadCount && contact.unreadCount !== 0">
    <span class="bubble">
      {{ (contact.unreadCount > 9) ? '9+' : contact.unreadCount }}
    </span>
  </div>
</div>
