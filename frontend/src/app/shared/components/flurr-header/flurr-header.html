<header class="site-header" role="banner">
  <div class="left">
    <div class="logo">Flairr.</div>

    <div class="search-wrap">
      <div class="search-container" role="search">
        <input
          #searchInput
          id="search-input"
          type="text"
          name="flairr-search"
          autocomplete="new-password"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Search users or spaces"
          (focus)="openSearch()"
          (input)="onSearch($event)"
        />

        <i class="fa fa-magnifying-glass"></i>
      </div>

      <!-- DROPDOWN -->
      <div class="search-dropdown" *ngIf="searchOpen">
        <div *ngIf="loading" class="search-loading">Searching…</div>

        <ng-container *ngIf="!loading">
          <!-- USERS -->
          <div class="search-group" *ngIf="users.length">
            <div class="search-title">Users</div>

            <div class="search-item" *ngFor="let user of users" (click)="goToUser(user.user_id)">
              <img [src]="user.avatar_img || defaultAvatar" />
              <span>{{ user.full_name }}</span>
            </div>
          </div>

          <!-- SPACES -->
          <div class="search-group" *ngIf="spaces.length">
            <div class="search-title">Spaces</div>

            <div
              class="search-item"
              *ngFor="let space of spaces"
              (click)="goToSpace(space.space_id)"
            >
              <img [src]="space.avatar_img || defaultSpace" />
              <span>{{ space.space_name }}</span>
            </div>
          </div>

          <div class="search-empty" *ngIf="!users.length && !spaces.length">No results found</div>
        </ng-container>
      </div>
    </div>
  </div>

  <nav class="center" role="navigation" aria-label="Main navigation">
    <button
      *ngFor="let item of items; let i = index"
      class="icon-item"
      [class.active]="activeKey === item.key"
      [attr.aria-pressed]="activeKey === item.key"
      (click)="toggle(item.key, $event)"
      (keydown)="onKeydown($event, i)"
      type="button"
      [attr.title]="item.label"
      [routerLink]="['/', item.key]"
    >
      <span class="icon-bubble" aria-hidden="true">
        <img
          [src]="'/assets/icons/header/' + item.key + '.svg'"
          [attr.alt]="item.label"
          width="30"
          height="30"
        />
      </span>
      <span class="icon-label">{{ item.label }}</span>
    </button>
  </nav>

  <div class="right">
    <a routerLink="/notifications">
      <img src="assets/icons/header/notifications.svg" alt="notifications-icon" />
    </a>
    <a [routerLink]="['/messages']" routerLinkActive="active" aria-label="Messages">
      <img src="assets/icons/header/messages.svg" alt="messages-icon" />
    </a>

    <div class="avatar-wrap" title="Profile" (click)="$event.stopPropagation()">
      <img
        class="avatar-img"
        [src]="userAvatar"
        alt="User avatar"
        [routerLink]="['/profile', userId]"
      />

      <button
        class="avatar-toggle"
        type="button"
        aria-haspopup="true"
        [attr.aria-expanded]="profileOpen"
        (click)="toggleProfile($event)"
        aria-label="Open profile menu"
      >
        <svg width="15" height="15" viewBox="0 0 24 24">
          <path
            d="M6 9l6 6 6-6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <div class="avatar-menu" *ngIf="profileOpen" role="menu" (click)="$event.stopPropagation()">
        <a role="menuitem" routerLink="/profile">Profile</a>
        <a role="menuitem" routerLink="/settings">Settings</a>
        <a role="menuitem" (click)="openLogoutDialog()">Log out</a>
      </div>
    </div>
  </div>
</header>
