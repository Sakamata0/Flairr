<h2 class="header-dialog" mat-dialog-title>Create Your Journey</h2>

<form #f="ngForm">
  <mat-dialog-content class="content-dialog">

    <!-- upper section: user info and privacy -->
    <div class="flurr-upper">
      <div class="user-info">
        <img [src]="user()?.avatarImg" alt="avatar-example" />
      </div>

      <div class="user-details">
        <h4>{{ user()?.fullName }}</h4>

        <!-- privacy select -->
        <mat-form-field appearance="outline" class="flurr-select">
          <mat-select name="selectedPrivacy" [(ngModel)]="model.selectedPrivacy" placeholder="Privacy">
            <mat-option value="public">Public</mat-option>
            <mat-option value="private">Private</mat-option>
            <mat-option value="friends">Friends</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <!-- form section: journey name + description + first flurr -->
    <div class="journey-inputs">

      <!-- journey name -->
      <mat-form-field appearance="fill" class="journey-field">
        <mat-label>Journey name</mat-label>
        <input
          required
          matInput
          name="journeyName"
          [(ngModel)]="model.journeyName"
          placeholder="What do you want to call your Journey?"
        />
      </mat-form-field>

      <!-- journey description (optional / readonly) -->
      <mat-form-field appearance="fill" class="journey-field">
        <mat-label>Journey description</mat-label>
        <input
          required
          matInput
          name="journeyDescription"
          [(ngModel)]="model.journeyDescription"
          placeholder="How do you describe the start of your Journey?"
        />
      </mat-form-field>

      <!-- first Flurr textarea -->
      <!--<mat-form-field appearance="fill" class="flurr-textarea">
        <mat-label>First Flurr</mat-label>
        <textarea
          required
          matInput
          cdkTextareaAutosize
          #autosize="cdkTextareaAutosize"
          cdkAutosizeMinRows="3"
          cdkAutosizeMaxRows="3"
          name="flurrContent"
          [(ngModel)]="model.flurrContent"
          placeholder="Now, share with us your first Flurr..."
        ></textarea>
      </mat-form-field>-->

    </div>

    <!-- bottom section: optional media buttons -->
    <!--<div class="flurr-bottom">
      <p-fileUpload
        name="files"
        [customUpload]="true"
        [auto]="false"
        [multiple]="true"
        accept="image/*,video/*"
        [maxFileSize]="50 * 1024 * 1024"
        [showUploadButton]="false"
        (onSelect)="onFileSelect($event)"
      >
        <ng-template #empty>
          <div>Drag and drop files here</div>
        </ng-template>
      </p-fileUpload>
    </div>-->

  </mat-dialog-content>

  <!-- actions: submit button -->
  <mat-dialog-actions class="footer-dialog">
    <button
      class="btn"
      id="flurrBtn"
      matButton
      [disabled]="f.invalid || isSubmitting"
      (click)="onSubmit()"
    >
      <ng-container *ngIf="!isSubmitting; else loadingTpl">
        Add the Journey!
      </ng-container>
      <ng-template #loadingTpl>
        <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
      </ng-template>
    </button>
  </mat-dialog-actions>
</form>
